version: "3.8"

services:
  promptlens:
    build:
      context: .
      dockerfile: Dockerfile
    image: promptlens:latest
    container_name: promptlens-proxy
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - TARGET_BASE_URL=https://api.anthropic.com
      - PROMPTLENS_SSL_VERIFY=true
      - PROMPTLENS_VAULT_BACKEND=sqlite
      - PROMPTLENS_VAULT_DB=/app/data/vault.db
      - MAX_PAYLOAD_BYTES=52428800
      - LOG_LEVEL=INFO
      # Uncomment to secure admin endpoints
      # - PROMPTLENS_API_KEY=your_secure_api_key_here
      # - ANTHROPIC_API_KEY=your_anthropic_key_here
      # - OPENAI_API_KEY=your_openai_key_here
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
